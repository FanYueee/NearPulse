<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>NearPulse — 開口就通報</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="stylesheet" href="/mobile/style.css" />
</head>
<body>

<main id="main">

  <header class="head">
    <div class="logo">Near<span>Pulse</span></div>
    <button class="lang" id="lang-toggle" type="button">EN</button>
  </header>

  <!-- 緊急橫幅: 電腦按下測試 → 附近有狀況, 確認後進入協助頁 -->
  <div class="alert hidden" id="alert-banner">
    <div class="a-text">
      <b id="alert-title">附近有狀況</b>
      <span id="alert-sub">有人在附近回報事件 — 是你這裡嗎？</span>
    </div>
    <button class="a-yes" id="alert-yes" type="button">是我這裡</button>
    <button class="a-no" id="alert-no" type="button">不是我</button>
  </div>

  <!-- 步驟 1: 說 -->
  <section class="step" id="step-say">
    <h1 id="t-big">怎麼了？<br />用說的就好</h1>
    <p class="sub" id="t-sub">按住說話，AI 會自動判斷狀況、整理位置與引導方向</p>

    <button class="mic" id="mic" type="button" aria-label="按住說話">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/>
      </svg>
    </button>
    <div class="mic-state" id="mic-state">按住開始說話</div>

    <!-- SOS 工具: 聲光警報 + 快速撥號 (危急時不需思考) -->
    <div class="sos-strip">
      <button class="sos-btn" id="sos-siren" type="button">聲光警報</button>
      <a class="sos-btn call" href="tel:110">報警 110</a>
      <a class="sos-btn call" href="tel:119">救護 119</a>
    </div>

    <div class="gps-line" id="gps-line">
      <span id="gps-txt">定位中…</span>
    </div>

    <details class="fallback">
      <summary>不方便說話？</summary>
      <textarea id="type-fallback" rows="2" placeholder="打一句現況，AI 一樣會判讀"></textarea>
      <button class="soft" id="type-send" type="button">送出</button>
    </details>
  </section>

  <!-- 步驟 2: AI 判讀卡 -->
  <section class="step hidden" id="step-check">
    <h2>AI 聽到了：</h2>
    <div class="heard" id="heard-text"></div>
    <div class="verdict" id="verdict"></div>
    <button class="solid" id="btn-confirm" type="button">確認送出</button>
    <button class="ghost" id="btn-redo" type="button">重講一次</button>
  </section>

  <!-- 步驟 3: 協助頁 (事件進行中) — 逃命優先, 大字引導 -->
  <section class="step hidden" id="step-live">

    <div class="guide-card" id="guide-card">
      <div class="g-head">你該怎麼做</div>
      <div id="guide-list"></div>
    </div>

    <!-- 逃脫地圖: 危險點(紅) + 你(藍) + 安全方向(綠), 點安全點開 Google Maps 導航 -->
    <div class="escape-map hidden" id="escape-wrap">
      <div class="em-head">
        <span>逃脫方向</span>
        <button class="em-nav" id="btn-nav" type="button">開始導航</button>
      </div>
      <div id="escape-map" style="height:200px;border-radius:12px;overflow:hidden"></div>
      <div class="em-tip">綠色標示 = 建議前往的安全方向 · 點「開始導航」用 Google Maps 步行導航</div>
    </div>

    <div class="fact-strip" id="fact-strip"></div>

    <button class="solid wide" id="btn-safe" type="button">我已到安全處 / 事件結束了</button>
    <button class="ghost wide" id="btn-imok" type="button">報平安 — 告訴家人我安全了</button>

    <!-- 補充現況: 跟首頁一樣的大麥克風 (按住說) -->
    <div class="more-zone">
      <div class="more-title">有新狀況？用說的補充</div>
      <button class="mic small" id="mic2" type="button" aria-label="按住補充現況">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/>
        </svg>
      </button>
      <div class="mic-state" id="mic2-state">按住補充</div>
    </div>
  </section>

  <!-- 當前發生狀況 (旁觀者入口; 事件中自動隱藏) -->
  <section class="step hidden" id="step-browse">
    <h2 id="browse-title">當前發生狀況</h2>
    <div id="browse-list"><div class="empty">附近目前沒有回報中的狀況</div></div>
    <button class="ghost wide" id="btn-browse-back" type="button">回到通報</button>
  </section>

  <!-- 底部導航: 僅首頁顯示 (事件中自動隱藏 — 逃命時不需要) -->
  <nav class="bottom" id="nav">
    <button class="nav-btn on" data-v="say" type="button">通報</button>
    <button class="nav-btn" data-v="browse" type="button">當前狀況</button>
  </nav>
</main>

<div class="toast" id="toast"></div>
<script src="/mobile/app.js"></script>
</body>
</html>
